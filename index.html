<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Liberty City | Roleplay</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
	html, body {
		margin: 0;
		height: 100%;
		overflow: hidden;
		background: #000;
	}

	/* Форма кадра: ширина : высота. Картинка всегда на всю ширину экрана (боковых полос нет),
	   а чёрные полосы остаются только сверху и снизу, как в кино.
	   Чем БОЛЬШЕ число, тем толще чёрные полосы (2.35 - как в кино, 2.2 - толстые).
	   Чем МЕНЬШЕ число, тем тоньше полосы и больше сама картинка (1.9 - сейчас, 1.8 - самые тонкие).
	   Не ставьте меньше 1.8. */
	:root { --ar: 1.9; }

	/* Кадр по центру экрана на всю ширину; файл background.jpg лежит рядом с этим файлом */
	#bg {
		position: fixed;
		left: 0;
		right: 0;
		top: 50%;
		height: calc(100vw / var(--ar));
		transform: translateY(-50%);
		background: url("background.jpg") center / 100% auto no-repeat;
	}

	/* Текст внизу по центру, в чёрной полосе под картинкой */
	#tip {
		position: fixed;
		left: 50%;
		bottom: 0;
		transform: translateX(-50%);
		width: 46vw;
		height: max(calc((100vh - 100vw / var(--ar)) / 2), 56px);
		display: flex;
		flex-direction: column;
		align-items: center;
		justify-content: center;
		text-align: center;
		pointer-events: none;
		opacity: 0;
		transition: opacity 0.8s ease;
		text-shadow: 0 1px 6px #000, 0 0 12px #000;
	}
	#tip .tag {
		font: 600 clamp(10px, 0.9vw, 14px) Arial, sans-serif;
		letter-spacing: 0.25em;
		color: #6fb9c8;
		margin-bottom: 6px;
	}
	#tip .text {
		font: italic clamp(14px, 1.45vw, 22px) / 1.35 Georgia, "Times New Roman", serif;
		color: rgba(255, 255, 255, 0.88);
	}
</style>
</head>
<body>
	<div id="bg"></div>

	<!-- Цитаты, слухи и советы по кругу -->
	<div id="tip"><div class="tag" id="tipTag"></div><div class="text" id="tipText"></div></div>

	<!-- Музыка (файл music.mp3 лежит рядом с этим файлом), играет по кругу -->
	<audio id="music" src="music.mp3" autoplay loop preload="auto"></audio>

<script>
	var music = document.getElementById("music");

	music.volume = 0.2; // громкость от 0 до 1 (0.3 = 30%)

	function start() {
		var p = music.play();
		if (p && p.catch) p.catch(function () {});
	}

	// пробуем запустить сразу
	start();

	// повторные попытки автозапуска (в игре страница бывает готова к звуку не сразу)
	var tries = 0;
	var retry = setInterval(function () {
		if (!music.paused || ++tries > 60) {
			clearInterval(retry);
			return;
		}
		start();
	}, 1000);

	// GMod сообщает странице о ходе загрузки: используем это как ещё один повод запустить музыку
	function GameDetails() { if (music.paused) start(); }
	function DownloadingFile() { if (music.paused) start(); }
	function SetStatusChanged() { if (music.paused) start(); }

	// Обычные браузеры запрещают автозвук: тогда музыка стартует при первом клике или нажатии клавиши
	function firstGesture() {
		if (music.paused) start();
	}
	["click", "keydown", "touchstart"].forEach(function (name) {
		document.addEventListener(name, firstGesture);
	});

	// ------------------------------------------------------------------
	// Тексты на загрузочном экране. Формат строки:  ["МЕТКА", "Текст"],
	// Добавляйте и удаляйте строки как угодно. Внутри текста не используйте прямые кавычки ",
	// вместо них пишите «ёлочки».
	// ------------------------------------------------------------------
	var TIPS = [
		["ГОРОД",  "В Либерти ночь длинная, а память у города ещё длиннее."],
		["ГОРОД",  "Кофе в этом городе горький. Но новости горче."],
		["ГОРОД",  "Город не спит. Он просто притворяется, чтобы ты расслабился."],
		["ГОРОД",  "Если в переулке подозрительно тихо, значит, кто-то уже всё видел."],
		["ГОРОД",  "Деньги приходят и уходят. Репутация остаётся и работает на тебя. Или против."],
		["ГОРОД",  "Хороший адвокат стоит дороже хорошего пистолета и никогда не промахивается."],
		["ГОРОД",  "Тот, кто громко обещает, редко держит слово. Тот, кто молчит, обычно уже всё сделал."],

		["СЛУХ",   "Говорят, у порта по ночам видели чёрную машину без номеров. Утром её там уже не было."],
		["СЛУХ",   "Говорят, в каждом квартале есть человек, который знает про всех всё. Обычно он владелец закусочной."],
		["СЛУХ",   "Говорят, ломбардщики знают цену всему, кроме совести."],
		["СЛУХ",   "Говорят, в этом городе можно потерять всё за одну ночь и найти за одно утро."],
		["СЛУХ",   "Говорят, самые важные разговоры в городе начинаются со слов «просто мимо проходил»."],

		["СОВЕТ",  "Играй персонажа так, будто у него есть мама, долги и привычка опаздывать."],
		["СОВЕТ",  "Хорошая отыгровка заразна. Начни первым."],
		["СОВЕТ",  "Ты не обязан быть героем. Но быть интересным обязан."],
		["СОВЕТ",  "Перед тем как всё испортить, подумай: а у этой сцены есть красивое продолжение?"],
		["СОВЕТ",  "Незнакомец в переулке не враг и не друг. Это начало истории."],
		["СОВЕТ",  "Не знаешь, что сказать? Спроси про погоду. В Либерти это всегда начало серьёзного разговора."],

		["ФАКТ",   "Статую Счастья подарила Либерти-Сити Франция. Её открыли в 1886 году."],
		["ФАКТ",   "Здание «Цирконий» меньше года было самым высоким зданием в городе, пока в 1931 году не построили Роттердам-тауэр."],
		["ФАКТ",   "В 1884 году по Брокерскому мосту провели слонов, чтобы доказать горожанам, что он выдержит."],
		["ФАКТ",   "Метро в Либерти открылось в 1879 году и с тех пор не прекращало опаздывать."]
	];

	var tipBox = document.getElementById("tip");
	var tipTag = document.getElementById("tipTag");
	var tipText = document.getElementById("tipText");

	function shuffle(a) {
		for (var i = a.length - 1; i > 0; i--) {
			var j = Math.floor(Math.random() * (i + 1));
			var t = a[i]; a[i] = a[j]; a[j] = t;
		}
		return a;
	}

	var order = shuffle(TIPS.slice());
	var tipIndex = 0;

	function showNextTip() {
		var t = order[tipIndex % order.length];
		tipIndex++;

		tipBox.style.opacity = 0;
		setTimeout(function () {
			tipTag.textContent = t[0];
			tipText.textContent = t[1];
			tipBox.style.opacity = 1;
		}, 800);

		// чем длиннее текст, тем дольше он висит
		setTimeout(showNextTip, 800 + 3500 + t[1].length * 50);
	}

	setTimeout(showNextTip, 600);
</script>
</body>
</html>
