<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Liberty City | Roleplay</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
	html, body {
		margin: 0;
		height: 100%;
		overflow: hidden;
		background: #000;
	}

	/* Фото целиком, как в оригинале, с чёрными полосами (файл background.jpg лежит рядом с этим файлом).
	   Чтобы растянуть фото на весь экран без полос, замените "contain" на "cover". */
	#bg {
		position: fixed;
		inset: 0;
		background: #000 url("background.jpg") center / contain no-repeat;
	}

	/* Маленькая белая полупрозрачная кнопка звука справа внизу */
	#mute {
		position: fixed;
		right: 18px;
		bottom: 18px;
		width: 38px;
		height: 38px;
		padding: 0;
		border: 0;
		border-radius: 50%;
		background: rgba(255, 255, 255, 0.16);
		cursor: pointer;
		opacity: 0.55;
		transition: opacity 0.2s, background 0.2s;
	}
	#mute:hover {
		opacity: 1;
		background: rgba(255, 255, 255, 0.3);
	}
	#mute svg {
		display: block;
		width: 22px;
		height: 22px;
		margin: 8px;
		fill: #fff;
	}
	#mute .off { display: none; }
	#mute.muted .on { display: none; }
	#mute.muted .off { display: block; }
</style>
</head>
<body>
	<div id="bg"></div>

	<!-- Музыка (файл music.mp3 лежит рядом с этим файлом), играет по кругу -->
	<audio id="music" src="music.mp3" autoplay loop preload="auto"></audio>

	<button id="mute" title="Звук вкл / выкл">
		<svg class="on" viewBox="0 0 24 24"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/></svg>
		<svg class="off" viewBox="0 0 24 24"><path d="M16.5 12c0-1.77-1.02-3.29-2.5-4.03v2.21l2.45 2.45c.03-.2.05-.41.05-.63zm2.5 0c0 .94-.2 1.82-.54 2.64l1.51 1.51C20.63 14.91 21 13.5 21 12c0-4.28-2.99-7.86-7-8.77v2.06c2.89.86 5 3.54 5 6.71zM4.27 3L3 4.27 7.73 9H3v6h4l5 5v-6.73l4.25 4.25c-.67.52-1.42.93-2.25 1.18v2.06c1.38-.31 2.63-.95 3.69-1.81L19.73 21 21 19.73l-9-9L4.27 3zM12 4L9.91 6.09 12 8.18V4z"/></svg>
	</button>

<script>
	var music = document.getElementById("music");
	var btn = document.getElementById("mute");

	music.volume = 0.4; // громкость от 0 до 1

	// значок: "звук выключен", если музыка не играет или заглушена
	function refresh() {
		btn.className = (music.paused || music.muted) ? "muted" : "";
	}

	function start() {
		var p = music.play();
		if (p && p.catch) p.catch(refresh);
	}

	music.addEventListener("play", refresh);
	music.addEventListener("pause", refresh);
	music.addEventListener("volumechange", refresh);

	// пробуем запустить сразу
	start();
	refresh();

	// Обычные браузеры запрещают автозвук: тогда музыка стартует при первом клике или нажатии клавиши
	function firstGesture(e) {
		if (e && e.target && btn.contains(e.target)) return; // клик по самой кнопке обрабатывается ниже
		if (music.paused) start();
	}
	["click", "keydown", "touchstart"].forEach(function (name) {
		document.addEventListener(name, firstGesture);
	});

	btn.onclick = function () {
		if (music.paused) {
			music.muted = false;
			start();
		} else {
			music.muted = !music.muted;
		}
	};
</script>
</body>
</html>
